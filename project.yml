name: ProductScan
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  ProductScan:
    type: application
    platform: iOS
    sources:
      - ProductScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhixing.productscan
        DEVELOPMENT_TEAM: 8T4ZML6C5S
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 成分扫描
        INFOPLIST_KEY_NSCameraUsageDescription: 需要使用相机拍摄商品配料表或标签
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 需要访问相册以选择配料表照片
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
